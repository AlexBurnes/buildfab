project:
  name: "step-variables-example"

actions:
  - name: build-image
    run: |
      echo "Building Docker image: ${{ image }}"
      echo "Using tag: ${{ tag }}"
      echo "Registry: ${{ registry }}"
      # docker build -t ${{ image }}:${{ tag }} .
  
  - name: test-image
    run: |
      echo "Testing Docker image: ${{ image }}"
      # docker run --rm ${{ image }}:${{ tag }} /bin/sh -c "echo test"
  
  - name: push-image
    run: |
      echo "Pushing Docker image: ${{ image }}"
      # docker push ${{ image }}:${{ tag }}

stages:
  # Example 1: Override matrix variable for specific step
  images-build-with-override:
    steps:
      - action: build-image
        matrix:
          values:
            image: [
              "registry.svc/clr-distr-centos8",
              "registry.svc/clr-distr-centos7",
              "registry.svc/burnes/development-env:9"
            ]
          strategy:
            max_parallel: 1
        variables:
          tag: "latest"
          registry: "registry.svc"
      
      # Use specific image for docker-build step
      - action: test-image
        require: ["build-image"]
        variables:
          image: "registry.svc/burnes/development-env:9"
          tag: "latest"
  
  # Example 2: Step-level variables for single action
  docker-build-specific:
    steps:
      - action: build-image
        variables:
          image: "registry.svc/burnes/production"
          tag: "v1.0.0"
          registry: "registry.svc"
      
      - action: test-image
        require: ["build-image"]
        variables:
          image: "registry.svc/burnes/production"
          tag: "v1.0.0"
      
      - action: push-image
        require: ["test-image"]
        variables:
          image: "registry.svc/burnes/production"
          tag: "v1.0.0"
  
  # Example 3: Different variables for different steps
  multi-environment-build:
    steps:
      - action: build-image
        variables:
          image: "registry.svc/burnes/dev"
          tag: "dev-latest"
          registry: "registry.svc"
      
      - action: build-image
        variables:
          image: "registry.svc/burnes/staging"
          tag: "staging-latest"
          registry: "registry.svc"
      
      - action: build-image
        variables:
          image: "registry.svc/burnes/production"
          tag: "prod-latest"
          registry: "registry.svc"

