project:
  name: project
  modules: [app1, app2, app3]

include:
  - "../project/update-checking-stages.yml"
  - "../project/update-checking-actions.yml"

stages:
  pre-push:
    steps:
      - action: version-check
      - action: version-greatest
      - action: version-module
      - action: rpm-build
        require: [version-module]
      - action: git-untracked
      - action: git-uncommitted
        onerror: warn
      - action: git-modified
        onerror: warn
      - action: yaml-ci-lint
      - action: yaml-ci-validate
      - action: yaml-project-lint
      - action: yaml-project-validate

  build-ctrl:
    steps:
      - action: build-cleanup
      - action: check-conan
      - action: check-cmake
      - action: install-conan-deps
        require: [check-conan, check-cmake]
      - action: configure-cmake
        require: [install-conan-deps]
      - action: build-binaries
        require: [configure-cmake]
      - action: install-binaries
        require: [build-binaries]
      - action: conan-cleanup-cache
        require: [build-binaries]

  build-rpm:
    steps:
      - action: build-scripts
      - action: rpm-cleanup
      - action: rpm-build
        require: [rpm-cleanup, build-scripts]

  upload-rpm:
    steps:
      - action: build-scripts
      - action: rpm-build
        require: [build-scripts]
      - action: rpm-upload
        require: [rpm-build]

  build-scripts:
    steps:
      - action: build-search
      - action: build-sql

  # build ctrl in docker container, check ci build locally
  images-build-ctrl:
    steps:
      - action: image-build-ctrl
        matrix:
          values:
            image: [
              "almalinux:9"
            ]
          strategy:
            max_parallel: 1
            fail_fast: false
            continue_on_error: false
            order: "fifo"

  # Run build rpm packages in docker containers, using local uncommitted source, only build
  images-build:
    steps:
      - action: image-build-rpm
        matrix:
          values:
            image: [
              "centos:8",
              "centos:7",
              "almalinux:9"
            ]
          strategy:
            max_parallel: 1
            fail_fast: false
            continue_on_error: false
            order: "fifo"

  # Run build rpm packages in docker containers, using local uncommitted source, build and upload
  images-build-all:
    steps:
      - action: version-check
      - action: version-greatest
      - action: image-build-ctrl
        variables:
          matrix.image: "almalinux:9"
        require: [version-check, version-greatest]
      - action: image-upload-rpm
        require: [image-build-ctrl]
        matrix:
          values:
            image: [
              "centos:8",
              "centos:7",
              "almalinux:9"
            ]
          strategy:
            max_parallel: 1
            fail_fast: false
            continue_on_error: false
            order: "fifo"
      - action: docker-build
        require: [image-upload-rpm]
      - action: docker-push
        require: [docker-build]

  # Build -support app docker image, check ci build locally
  docker-build:
    steps:
      - action: image-build-rpm
        variables:
          matrix.image: "centos:8"
      - action: docker-build
        require: [image-build-rpm]

  # Build -support app docker image and push, check ci build locally
  docker-build-upload:
    steps:
      - action: image-build-rpm
        variables:
          matrix.image: "centos:8"
      - action: docker-build
        require: [image-build-rpm]
      - action: docker-push
        require: [docker-build]

actions:

  - name: yaml-ci-lint
    run: |
      if [ -e $(which yamllint) ]; then
        yamllint -no-warnings .gitlab-ci.yml
      else
        echo -e "⚠️ for validate gitlab ci yml require install yamllint utility"
      fi

  - name: yaml-ci-validate
    run: |
      . ../project/colors.sh
      if [ -f .gitlab_tocken ]; then
          JSON_YAML=$(jq -n -arg yaml "$(cat .gitlab-ci.yml)" '{content: $yaml}')
          ERROR=$(curl -header "Content-Type: application/json" -H "PRIVATE-TOKEN: $(cat < .gitlab_tocken)" \
          -sS 'https://gitlab.example.com/api/v4/projects/Project/Module/ci/lint?include_merged_yaml=true' \
          -data "${JSON_YAML}" | jq -r '.errors[]?')
          if [ -z "${ERROR}" ]; then
              echo "✅ ci yml syntax is ${green}ok${clre}"
              exit 0
          else
              echo "💥 ci yml syntax ${red}failed, error:\n${ERROR}${clre}"
              exit 1
          fi
      else
          echo "⚠️ could not check, no gitlab tocken found, add tocken into .gitlab_tocken"
          exit 0
      fi

  - name: yaml-project-lint
    run: |
      if [ -e $(which yamllint) ]; then
        yamllint -no-warnings .project.yml
      else
        echo -e "⚠️ for validate project yml require install yamllint utility"
      fi
  - name: yaml-project-validate
    run: |
      buildfab validate

  - name: install-conan
    variants:
      - when: ${{ os == "centos" &&  os_version == "7" }}
        run: |
            pip3.12 install conan==2.6.0
            pip3.12 install setuptools
            [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
            conan profile detect -force

      - when: ${{ os == "almalinux" && os_version == "8.10" }}
        run: |
            [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
            cd /conan-io && pip3.12 install -e .
            conan profile detect -force
      - when: ${{ os == "almalinux" && os_version == "9.6" }}
        run: |
            [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
            conan profile detect -force
      - when: ${{ platform == "linux" }}
        run: |
          if [ ! -f $(which conan) ]; then
            echo "Installing Conan package manager..."
            if ! which pip3 >/dev/null 2>&1; then
              echo "pip3 is not installed. Please install Python and pip3 first"
              exit 1
            fi
            if pip3 install conan -break-system-packages 2>/dev/null; then
              echo "Conan installed successfully with -break-system-packages"
            elif pip3 install -user conan 2>/dev/null; then
              echo "Conan installed successfully in user directory"
              echo "You may need to add ~/.local/bin to your PATH"
            elif python3 -m pip install conan -break-system-packages 2>/dev/null; then
              echo "Conan installed successfully with python3 -m pip"
            else
              echo "Failed to install Conan via pip3. Please install manually:"
              echo "  # Option 1: Use system package manager"
              echo "  sudo apt install conan  # Ubuntu/Debian"
              echo "  # Option 2: Use pip3"
              echo "  pip3 install conan"
              echo "  # Option 3: Use virtual environment"
              echo "  python3 -m venv venv && source venv/bin/activate && pip3 install conan"
              exit 1
            fi
            conan -version
          else
            echo "✅ conan already installed, $(conan -version)"
          fi

  # Dependency installation actions
  - name: install-conan-deps
    variants:
      - when: ${{ platform == "linux" && (os == "centos" || os == "almalinux" || os == "debian") }}
        run: |
            [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
            BUILD_TYPE=$(scripts/version build-type)
            CONAN_PROFILE=$(pwd)"/build/${{os}}${{os_version}}/conan/$BUILD_TYPE"
            cd src/ctrl
            conan install . -of .build -pr:h $CONAN_PROFILE -pr:b $CONAN_PROFILE \
              -s build_type=$BUILD_TYPE -build missing
      - when: ${{ platform == "linux" }}
        run: |
            BUILD_TYPE=$(scripts/version build-type)
            CONAN_PROFILE="g++_$(echo ${BUILD_TYPE} | tr '[:upper:]' '[:lower:]').profile"
            cd src/ctrl
            conan install . -of .build -pr:h $CONAN_PROFILE -pr:b $CONAN_PROFILE \
              -s build_type=$BUILD_TYPE -build missing

  # Cleanup actions
  - name: conan-cleanup
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      conan remove -c 'svc-*'
      conan cache clean

  - name: conan-cleanup-cache
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      conan cache clean -s -b

  - name: build-cleanup
    run: |
      cd src/ctrl
      rm -fr .build

  # Build actions
  - name: configure-cmake
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      CONAN_PRESET="conan-$(./scripts/version build-type | tr '[:upper:]' '[:lower:]')"
      cd src/ctrl
      cmake -preset $CONAN_PRESET

  - name: build-binaries
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      CONAN_PRESET="conan-$(./scripts/version build-type | tr '[:upper:]' '[:lower:]')"
      cd src/ctrl
      cmake -build -preset $CONAN_PRESET -target ctrl

  - name: install-binaries
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      CONAN_PRESET="conan-$(./scripts/version build-type | tr '[:upper:]' '[:lower:]')"
      cd src/ctrl
      cmake -build -preset $CONAN_PRESET -target install-current

  # RPM Build and upload actions
  - name: rpm-build
    shell: bash
    run: |
      [ -f "build/${{os}}${{os_version}}/env" ] && . "build/${{os}}${{os_version}}/env"
      [ -d .rpmbuild ] && rm -fR .rpmbuild
      VERSION=$(scripts/version version)
      mkdir -p .rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
      tar -czhf .rpmbuild/SOURCES/${{project}}-${VERSION}.tar.gz bin etc sbin share var lib sql
      if [ -f ${{project}}.${{os}}${{os_version}}.spec ]; then
        cp ${{project}}.${{os}}${{os_version}}.spec .rpmbuild/SPECS/${{project}}.spec
      else
        cp ${{project}}.spec .rpmbuild/SPECS/${{project}}.spec
      fi
      rpmbuild -ba -define "_topdir ${PWD}/.rpmbuild" \
        -define "_sv_version ${VERSION}" \
        -define "_sv_release 1" \
        .rpmbuild/SPECS/${{project}}.spec
      set +e
      for pkg_file in $(find .rpmbuild/RPMS -name *.rpm); do
        chmod uog+rw $pkg_file
      done
      set -e

  - name: rpm-upload
    run: |
      BUILD_TYPE=$(scripts/version build-type)
      if [ "${BUILD_TYPE}" == "Release" ]; then
        BRANCH=stable
      else
        BRANCH=testing
      fi
      for pkg_file in $(find .rpmbuild/RPMS -name *.rpm); do
        pkg=$(basename $pkg_file)
        echo upload ${pkg_file} to "http://rpm.example.com/download/index.php?filename=${pkg}&branch=${BRANCH}"
        curl -upload-file ${pkg_file} "http://rpm.example.com/download/index.php?filename=${pkg}&branch=${BRANCH}"
      done

  # Run build in docker containers, check ci build locally
  - name: image-build-ctrl
    container:
      engine: podman
      image:
        from: ${{ matrix.image }}
      workdir: /-support
      mounts:
        - type: bind
          source: .
          target: /-support-src
          ro: true
      cache:
        conan: ./.cache
      cpu: 2
      memory: 4G
      network: host
      env_file: .docker-env-images
      run_stage: build-ctrl
      artifacts:
        output: .
        path:
          - bin/ctrl-linux-amd64-static

  # Run build in docker containers, check ci build locally
  - name: image-build-rpm
    container:
      engine: docker
      image:
        from: ${{ matrix.image }}
      workdir: /-support
      mounts:
        - type: bind
          source: .
          target: /-support-src
          ro: true
      cpu: 2
      memory: 4G
      network: host
      env_file: .docker-rpm-images
      run_stage: build-rpm
      artifacts:
        output: .
        path:
          - .rpmbuild/RPMS/*/*.rpm

  # Run build and upload in docker containers, check ci build locally
  - name: image-upload-rpm
    container:
      engine: docker
      image:
        from: ${{ matrix.image }}
      workdir: /-support
      mounts:
        - type: bind
          source: .
          target: /-support-src
          ro: true
      cpu: 2
      memory: 4G
      network: host
      env_file: .docker-rpm-images
      run_stage: upload-rpm
      artifacts:
        output: .
        path:
          - .rpmbuild/RPMS/*/*.rpm

  # Build docker container
  - name: docker-build
    container:
      engine: docker
      image:
        build:
          dockerfile: Dockerfile
          context: .
          args:
            RPM_BUILD_VERSION: ${{version.version}}
            BUILD_VERSION: ${{version.rawversion}}
          tags:
            - ${{project}}:${{version.rawversion}}
          network: host
          progress: plain

  # Push docker container
  - name: docker-push
    run: |
      sudo docker push ${{project}}:${{version.rawversion}}

  # Cleanup rpm build directory
  - name: rpm-cleanup
    run: |
      rm -fR .rpmbuild/*

  # Build scripts
  - name: build-scripts
    run: |
      VERSION="${{version.rawversion}}" bash interpolation.sh bin/sql.sh.template ./bin/sql.sh
      VERSION="${{version.rawversion}}" bash interpolation.sh bin/search.sh.template ./bin/search.sh

  - name: build-sql
    run: |
      VERSION="${{version.rawversion}}" bash interpolation.sh bin/sql.sh.template ./bin/sql.sh

  - name: build-search
    run: |
      VERSION="${{version.rawversion}}" bash interpolation.sh bin/search.sh.template ./bin/search.sh
