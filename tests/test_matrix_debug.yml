project:
  name: "matrix-debug-test"
  modules: ["matrix-testing"]

actions:
  - name: debug-matrix
    run: |
      echo "Matrix test: ${{ matrix.test_name }}"
      echo "Platform: ${{ matrix.platform }}"

stages:
  debug-matrix:
    steps:
      - action: debug-matrix
        matrix:
          values:
            test_name: ["test1", "test2"]
            platform: ["linux", "windows"]
          strategy:
            max_parallel: 2
            fail_fast: false
            continue_on_error: false
            order: "fifo"
