project:
  name: test-container-artifacts-run-action

# Test container artifact collection with run_action

actions:
  # Action that creates a file
  - name: create-artifact-file
    description: Create a test artifact file
    run: |
      mkdir -p /artifacts/data
      echo "Hello from run_action!" > /artifacts/data/test.txt
      cat /artifacts/data/test.txt

  # Container action that runs the above action
  - name: test-run-action-artifact
    description: Test collecting artifacts from run_action
    container:
      image:
        from: alpine:latest
      run_action: create-artifact-file
      artifacts:
        output: ./test-artifacts/run-action
        path:
          - /artifacts/data/test.txt
    # Expected: ./test-artifacts/run-action/artifacts/data/test.txt

stages:
  test-stage:
    steps:
      - action: create-artifact-file

  # Test run_action with artifacts
  test-run-action:
    steps:
      - action: test-run-action-artifact

